name: Deploy

# CI(ci.yml)が終わったときに起動する。workflow_run は main にあるこのファイルだけを使う(docs/specs/033-auto-deploy.md)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# 既定の権限は、リポジトリを読むだけにする
permissions:
  contents: read

# 連続してマージしたときは、前のデプロイの完了を待つ。途中で取り消すと、migrate と api のイメージが食い違ったまま止まることがある
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Action はタグではなく SHA で指定する(docs/specs/007-ci.md)
jobs:
  deploy:
    # main への push で実行された CI が成功したときだけ。PR の CI では起動しない
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    # production を宣言すると、OIDC トークンに "environment": "production" が入る(ADR 0009)
    environment:
      name: production
      url: https://knowledge-library-prod.web.app
    permissions:
      contents: read
      id-token: write # OIDC トークンの発行を許可する
    env:
      PROJECT_ID: knowledge-library-prod
      REGION: asia-northeast1
      IMAGE: asia-northeast1-docker.pkg.dev/knowledge-library-prod/knowledge-library/api
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }} # HEAD_SHA は CI が確認したコミットの ID
    steps:
      # 1. CI が確認したコミットを取り出す。イメージのタグは、コミットの短い ID(7文字)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 GItHub 上のリポジトリに保存されたプログラム
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - run: echo "TAG=${HEAD_SHA::7}" >> "$GITHUB_ENV"

      # 2. Workload Identity 連携で、deployer の権限を借用する
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 Google が公開している Action
        with:
          workload_identity_provider: projects/656607631341/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: deployer@knowledge-library-prod.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # 3. Rails のイメージをビルドし、Artifact Registry に保存する。ランナーは amd64 なので --platform は要らない
      - run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet
      - run: docker build -t "$IMAGE:$TAG" api
      - run: docker push "$IMAGE:$TAG"

      # 4. ジョブ migrate のイメージを替えて実行し、完了まで待つ(表を先に更新する。ADR 0006)
      - run: gcloud run jobs update migrate --image="$IMAGE:$TAG" --region="$REGION" --project="$PROJECT_ID"
      - run: gcloud run jobs execute migrate --wait --region="$REGION" --project="$PROJECT_ID"

      # 5. サービス api のイメージを替える。環境変数やシークレットなどの設定は、今の設定のまま
      - run: gcloud run services update api --image="$IMAGE:$TAG" --region="$REGION" --project="$PROJECT_ID"

      # 6. Vue をビルドする。設定値は Environment production の Variables から読む
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0 # web/Dockerfile.dev と CI とそろえる
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

      # 7. Firebase Hosting にデプロイする(docs/production-setup.md の 4.6 と同じ版)
      - run: npx --yes firebase-tools@15.34.2 deploy --only hosting --project "$PROJECT_ID"
